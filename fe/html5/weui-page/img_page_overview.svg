<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0faf4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8f5e9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#07c160"/>
      <stop offset="100%" style="stop-color:#06ad56"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1989fa"/>
      <stop offset="100%" style="stop-color:#1676d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00000015"/>
    </filter>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">从零搭建WeUI风格页面：BEM + HTML5 + CSS Reset</text>
  <line x1="180" y1="58" x2="620" y2="58" stroke="#07c160" stroke-width="3" stroke-linecap="round"/>

  <!-- Card 1: HTML5语义化 -->
  <rect x="30" y="80" width="230" height="180" rx="10" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="30" y="80" width="230" height="42" rx="10" fill="url(#primaryGrad)"/>
  <rect x="30" y="112" width="230" height="10" fill="url(#primaryGrad)"/>
  <text x="145" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">🏷️ HTML5 语义化</text>

  <rect x="50" y="135" width="190" height="28" rx="5" fill="#f0faf4"/>
  <text x="145" y="154" text-anchor="middle" font-size="12" fill="#333">&lt;header&gt; 页头区域</text>

  <rect x="50" y="170" width="190" height="28" rx="5" fill="#f0faf4"/>
  <text x="145" y="189" text-anchor="middle" font-size="12" fill="#333">&lt;main&gt; 主体内容</text>

  <rect x="50" y="205" width="190" height="28" rx="5" fill="#f0faf4"/>
  <text x="145" y="224" text-anchor="middle" font-size="12" fill="#333">&lt;h1&gt; 标题层级</text>

  <!-- Card 2: BEM命名 -->
  <rect x="285" y="80" width="230" height="180" rx="10" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="285" y="80" width="230" height="42" rx="10" fill="#1989fa"/>
  <rect x="285" y="112" width="230" height="10" fill="#1989fa"/>
  <text x="400" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">📐 BEM 命名规范</text>

  <rect x="305" y="135" width="190" height="28" rx="5" fill="#edf4ff"/>
  <text x="400" y="154" text-anchor="middle" font-size="12" fill="#333">.page → Block</text>

  <rect x="305" y="170" width="190" height="28" rx="5" fill="#edf4ff"/>
  <text x="400" y="189" text-anchor="middle" font-size="12" fill="#333">.page__hd → Element</text>

  <rect x="305" y="205" width="190" height="28" rx="5" fill="#edf4ff"/>
  <text x="400" y="224" text-anchor="middle" font-size="12" fill="#333">.weui-btn_primary → Modifier</text>

  <!-- Card 3: CSS Reset -->
  <rect x="540" y="80" width="230" height="180" rx="10" fill="#fff" filter="url(#cardShadow)"/>
  <rect x="540" y="80" width="230" height="42" rx="10" fill="#ff6b6b"/>
  <rect x="540" y="112" width="230" height="10" fill="#ff6b6b"/>
  <text x="655" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">🧹 CSS Reset</text>

  <rect x="560" y="135" width="190" height="28" rx="5" fill="#fff0f0"/>
  <text x="655" y="154" text-anchor="middle" font-size="12" fill="#333">margin/padding 归零</text>

  <rect x="560" y="170" width="190" height="28" rx="5" fill="#fff0f0"/>
  <text x="655" y="189" text-anchor="middle" font-size="12" fill="#333">统一浏览器默认样式</text>

  <rect x="560" y="205" width="190" height="28" rx="5" fill="#fff0f0"/>
  <text x="655" y="224" text-anchor="middle" font-size="12" fill="#333">❌ 不用 * 通配符</text>

  <!-- Bottom Section: Code Preview -->
  <rect x="30" y="280" width="740" height="200" rx="10" fill="#1e1e1e" filter="url(#shadow)"/>

  <!-- Code Lines with Syntax Highlighting Colors -->
  <text x="55" y="312" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#808080">&lt;!-- BEM 命名规范 --&gt;</text>
  <text x="55" y="336" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;div</text>
  <text x="95" y="336" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#9cdcfe">class=</text>
  <text x="155" y="336" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#ce9178">"page"</text>
  <text x="220" y="336" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&gt;</text>

  <text x="75" y="360" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;header</text>
  <text x="150" y="360" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#9cdcfe">class=</text>
  <text x="210" y="360" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#ce9178">"page__hd"</text>
  <text x="315" y="360" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&gt;</text>

  <text x="95" y="384" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;h1</text>
  <text x="138" y="384" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#9cdcfe">class=</text>
  <text x="198" y="384" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#ce9178">"page__title"</text>
  <text x="312" y="384" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&gt;</text>
  <text x="345" y="384" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#d4d4d4">这是一个页面</text>
  <text x="481" y="384" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;/h1&gt;</text>

  <text x="75" y="410" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;main</text>
  <text x="135" y="410" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#9cdcfe">class=</text>
  <text x="195" y="410" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#ce9178">"page__bd"</text>
  <text x="296" y="410" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&gt;</text>
  <text x="336" y="410" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#6a9955">...按钮组件...</text>
  <text x="490" y="410" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;/main&gt;</text>

  <text x="55" y="436" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#569cd6">&lt;/div&gt;</text>
  <text x="128" y="436" font-family="'Fira Code','Consolas',monospace" font-size="13" fill="#808080">&lt;!-- .page__hd / .page__bd  = Block__Element --&gt;</text>

  <!-- Annotation Arrow -->
  <line x1="540" y1="190" x2="560" y2="390" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="460" y1="190" x2="475" y2="360" stroke="#1989fa" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="570" y="415" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#ff6b6b">BEM命名：Block__Element</text>
</svg>