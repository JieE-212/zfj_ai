<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">页面结构分层示意：从 HTML 到视觉呈现</text>

  <!-- Left: HTML Structure Tree -->
  <rect x="30" y="65" width="350" height="465" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="205" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#07c160">📄 HTML 结构树</text>

  <!-- Tree Structure -->
  <line x1="205" y1="115" x2="205" y2="135" stroke="#07c160" stroke-width="2"/>
  <rect x="140" y="140" width="130" height="36" rx="8" fill="#07c160"/>
  <text x="205" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">div.page</text>

  <!-- Branch lines -->
  <line x1="205" y1="176" x2="115" y2="195" stroke="#07c160" stroke-width="1.5"/>
  <line x1="205" y1="176" x2="295" y2="195" stroke="#07c160" stroke-width="1.5"/>

  <!-- Left Branch: header -->
  <rect x="50" y="200" width="130" height="36" rx="8" fill="#1989fa"/>
  <text x="115" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">header.page__hd</text>

  <line x1="115" y1="236" x2="90" y2="255" stroke="#1989fa" stroke-width="1.5"/>
  <line x1="115" y1="236" x2="140" y2="255" stroke="#1989fa" stroke-width="1.5"/>

  <rect x="25" y="260" width="130" height="35" rx="6" fill="#edf4ff"/>
  <text x="90" y="282" text-anchor="middle" font-size="12" fill="#333">h1.page__title</text>

  <rect x="155" y="260" width="130" height="35" rx="6" fill="#edf4ff"/>
  <text x="220" y="282" text-anchor="middle" font-size="12" fill="#333">p.page__desc</text>

  <!-- Right Branch: main -->
  <rect x="230" y="200" width="130" height="36" rx="8" fill="#ff6b6b"/>
  <text x="295" y="223" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">main.page__bd</text>

  <line x1="295" y1="236" x2="295" y2="255" stroke="#ff6b6b" stroke-width="1.5"/>

  <rect x="195" y="260" width="200" height="35" rx="6" fill="#fff0f0"/>
  <text x="295" y="282" text-anchor="middle" font-size="12" fill="#333">div.button-sp-area</text>

  <line x1="295" y1="295" x2="245" y2="315" stroke="#ff6b6b" stroke-width="1"/>
  <line x1="295" y1="295" x2="345" y2="315" stroke="#ff6b6b" stroke-width="1"/>

  <rect x="170" y="320" width="150" height="32" rx="6" fill="#fff0f0"/>
  <text x="245" y="340" text-anchor="middle" font-size="11" fill="#333">a.weui-btn_primary</text>

  <rect x="330" y="320" width="150" height="32" rx="6" fill="#fff0f0"/>
  <text x="405" y="340" text-anchor="middle" font-size="11" fill="#333">a.weui-btn_default</text>

  <!-- Legend -->
  <rect x="50" y="400" width="310" height="110" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
  <text x="205" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#333">图例</text>
  <rect x="75" y="440" width="16" height="16" rx="3" fill="#07c160"/>
  <text x="100" y="453" font-size="12" fill="#555">Block（块）</text>
  <rect x="180" y="440" width="16" height="16" rx="3" fill="#1989fa"/>
  <text x="205" y="453" font-size="12" fill="#555">Element（元素）</text>
  <rect x="295" y="440" width="16" height="16" rx="3" fill="#ff6b6b"/>
  <text x="320" y="453" font-size="12" fill="#555">嵌套内容</text>
  <text x="205" y="485" text-anchor="middle" font-size="11" fill="#999">__ 双下划线 = Block__Element</text>
  <text x="205" y="502" text-anchor="middle" font-size="11" fill="#999">_ 单下划线 = Block_modifier</text>

  <!-- Right: Visual Rendering -->
  <rect x="410" y="65" width="360" height="465" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="590" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#07c160">🎨 视觉渲染效果</text>

  <!-- iPhone-like mockup -->
  <rect x="425" y="115" width="330" height="395" rx="20" fill="#ededed" stroke="#d0d0d0" stroke-width="2"/>

  <!-- Header area -->
  <rect x="425" y="115" width="330" height="120" rx="20" fill="#fff"/>
  <rect x="425" y="215" width="330" height="20" fill="#fff"/>

  <text x="590" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">这是一个页面</text>
  <text x="590" y="182" text-anchor="middle" font-size="13" fill="#999">这是一个页面的描述</text>

  <!-- Body area -->
  <text x="590" y="175" text-anchor="middle" font-size="0" fill="transparent">.</text>

  <!-- Buttons -->
  <rect x="462" y="260" width="256" height="46" rx="8" fill="#07c160"/>
  <text x="590" y="289" text-anchor="middle" font-size="15" font-weight="500" fill="#fff">主要按钮</text>

  <rect x="462" y="320" width="256" height="46" rx="8" fill="rgba(0,0,0,0.1)"/>
  <text x="590" y="349" text-anchor="middle" font-size="15" font-weight="500" fill="rgba(0,0,0,0.9)">次要按钮</text>

  <rect x="462" y="380" width="256" height="46" rx="8" fill="rgba(0,0,0,0.1)"/>
  <text x="590" y="409" text-anchor="middle" font-size="15" font-weight="500" fill="rgba(0,0,0,0.9)">次要按钮</text>

  <!-- Annotation -->
  <text x="590" y="490" text-anchor="middle" font-size="11" fill="#999">WeUI 风格页面渲染示意</text>

  <!-- Connecting arrow -->
  <text x="400" y="300" text-anchor="middle" font-size="30" fill="#07c160">→</text>
</svg>