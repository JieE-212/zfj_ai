<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e8ecef"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000010"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)" rx="12"/>

  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">🔍 微信UI按钮：像素级还原的细节之美</text>

  <!-- Main Button Visual -->
  <rect x="260" y="65" width="280" height="56" rx="10" fill="#07c160" filter="url(#shadow)"/>
  <text x="400" y="99" text-anchor="middle" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-weight="500" fill="#fff">主要按钮</text>

  <!-- Dimension Lines and Annotations -->
  <!-- Height annotation -->
  <line x1="230" y1="68" x2="230" y2="118" stroke="#ff6b6b" stroke-width="1.5"/>
  <line x1="225" y1="68" x2="235" y2="68" stroke="#ff6b6b" stroke-width="1.5"/>
  <line x1="225" y1="118" x2="235" y2="118" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="220" y="96" text-anchor="end" font-size="13" font-weight="600" fill="#ff6b6b">高度 24px</text>
  <text x="150" y="96" text-anchor="end" font-size="11" fill="#999">UI设计师标注</text>

  <!-- Font size annotation -->
  <line x1="560" y1="68" x2="600" y2="68" stroke="#1989fa" stroke-width="1.5"/>
  <text x="565" y="62" font-size="13" font-weight="600" fill="#1989fa">font-size: 17px</text>

  <!-- line-height calculation -->
  <rect x="260" y="140" width="280" height="60" rx="8" fill="#fff" filter="url(#shadow)"/>
  <text x="400" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#333">📐 line-height 计算</text>
  <text x="400" y="186" text-anchor="middle" font-size="13" font-family="'Fira Code',monospace" fill="#ff6b6b">24 ÷ 17 = 1.41176471</text>

  <!-- Detail cards -->
  <rect x="25" y="220" width="175" height="110" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="112" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#07c160">📱 移动端优化</text>
  <text x="112" y="274" text-anchor="middle" font-size="11" fill="#555">-webkit-tap-highlight</text>
  <text x="112" y="294" text-anchor="middle" font-size="11" fill="#555">去掉点击高亮色块</text>
  <text x="112" y="314" text-anchor="middle" font-size="11" fill="#555">提升触屏体验</text>

  <rect x="215" y="220" width="175" height="110" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="302" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#1989fa">🖱️ 防误触</text>
  <text x="302" y="274" text-anchor="middle" font-size="11" fill="#555">user-select: none</text>
  <text x="302" y="294" text-anchor="middle" font-size="11" fill="#555">禁止用户选中</text>
  <text x="302" y="314" text-anchor="middle" font-size="11" fill="#555">按钮上的文字</text>

  <rect x="405" y="220" width="175" height="110" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="492" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#ff9800">🎨 圆角标准</text>
  <text x="492" y="274" text-anchor="middle" font-size="11" fill="#555">border-radius: 8px</text>
  <text x="492" y="294" text-anchor="middle" font-size="11" fill="#555">WeUI 标准圆角值</text>
  <text x="492" y="314" text-anchor="middle" font-size="11" fill="#555">视觉柔和舒适</text>

  <rect x="595" y="220" width="180" height="110" rx="10" fill="#fff" filter="url(#shadow)"/>
  <text x="685" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#9c27b0">📏 最小宽度</text>
  <text x="685" y="274" text-anchor="middle" font-size="11" fill="#555">min-width: 184px</text>
  <text x="685" y="294" text-anchor="middle" font-size="11" fill="#555">最大宽度 280px</text>
  <text x="685" y="314" text-anchor="middle" font-size="11" fill="#555">自适应内容</text>

  <!-- Code example bottom -->
  <rect x="25" y="350" width="750" height="112" rx="10" fill="#1e1e1e" filter="url(#shadow)"/>
  <!-- Code content -->
  <text x="45" y="375" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#569cd6">.weui-btn</text>
  <text x="125" y="375" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">{</text>

  <text x="65" y="396" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#9cdcfe">font-size</text>
  <text x="170" y="396" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">: </text>
  <text x="185" y="396" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#b5cea8">17px</text>
  <text x="225" y="396" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">;</text>
  <text x="240" y="396" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#6a9955">/* UI设计师标注的精确字号 */</text>

  <text x="65" y="417" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#9cdcfe">line-height</text>
  <text x="175" y="417" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">: </text>
  <text x="190" y="417" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#b5cea8">1.41176471</text>
  <text x="290" y="417" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">;</text>
  <text x="305" y="417" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#6a9955">/* 24÷17，保留八位小数 */</text>

  <text x="65" y="438" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#9cdcfe">border-radius</text>
  <text x="185" y="438" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">: </text>
  <text x="200" y="438" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#b5cea8">8px</text>
  <text x="230" y="438" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">;</text>
  <text x="245" y="438" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#6a9955">/* WeUI 标准圆角 */</text>

  <text x="45" y="459" font-family="'Fira Code','Consolas',monospace" font-size="12" fill="#d4d4d4">}</text>
</svg>