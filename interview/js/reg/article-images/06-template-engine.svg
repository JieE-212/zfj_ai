<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="stepArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="#fafafa"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#1e293b"/>
  <text x="400" y="31" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e2e8f0">🔄 微型模板引擎 · 递归替换原理</text>

  <!-- Data object -->
  <rect x="30" y="480" width="740" height="55" rx="8" fill="#1e293b"/>
  <text x="55" y="505" font-family="sans-serif" font-size="12" fill="#64748b">数据源 person</text>
  <text x="200" y="505" font-family="monospace" font-size="13" fill="#e2e8f0">const person = {</text>
  <text x="340" y="505" font-family="monospace" font-size="13" fill="#4ade80">name</text>
  <text x="380" y="505" font-family="monospace" font-size="13" fill="#94a3b8">: '</text>
  <text x="405" y="505" font-family="monospace" font-size="13" fill="#fbbf24">赖庆庆</text>
  <text x="470" y="505" font-family="monospace" font-size="13" fill="#94a3b8">',</text>
  <text x="495" y="505" font-family="monospace" font-size="13" fill="#4ade80">age</text>
  <text x="525" y="505" font-family="monospace" font-size="13" fill="#94a3b8">:</text>
  <text x="535" y="505" font-family="monospace" font-size="13" fill="#fbbf24">17</text>
  <text x="555" y="505" font-family="monospace" font-size="13" fill="#94a3b8">,</text>
  <text x="570" y="505" font-family="monospace" font-size="13" fill="#4ade80">sex</text>
  <text x="595" y="505" font-family="monospace" font-size="13" fill="#94a3b8">: '</text>
  <text x="620" y="505" font-family="monospace" font-size="13" fill="#fbbf24">男</text>
  <text x="645" y="505" font-family="monospace" font-size="13" fill="#94a3b8">' }</text>

  <!-- Step 1 -->
  <g>
    <rect x="30" y="70" width="740" height="95" rx="10" fill="white" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="30" y="70" width="60" height="95" rx="10" fill="#6366f1"/>
    <!-- clipped right corners for the step badge -->
    <rect x="60" y="70" width="30" height="95" fill="#6366f1"/>
    <text x="60" y="132" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">1</text>

    <text x="110" y="100" font-family="sans-serif" font-size="12" fill="#64748b">初始模板</text>
    <text x="110" y="125" font-family="monospace" font-size="15" fill="#1e293b">我是<tspan fill="#6366f1" font-weight="bold">{{name}}</tspan>，年龄{{age}}，性别{{sex}}</text>

    <!-- regex match -->
    <text x="110" y="150" font-family="monospace" font-size="12" fill="#a855f7">reg.test(template) → true ✓</text>
    <text x="410" y="150" font-family="monospace" font-size="12" fill="#a855f7">reg.exec(template)[1] → "name"</text>
  </g>

  <!-- Arrow Step 1 → Step 2 -->
  <polygon points="400,167 415,172 400,177" fill="#6366f1"/>
  <text x="435" y="175" font-family="sans-serif" font-size="11" fill="#6366f1">replace(&#123;&#123;name&#125;&#125;, "赖庆庆")</text>

  <!-- Step 2 -->
  <g>
    <rect x="30" y="185" width="740" height="95" rx="10" fill="white" stroke="#f97316" stroke-width="1.5"/>
    <rect x="30" y="185" width="60" height="95" rx="10" fill="#f97316"/>
    <rect x="60" y="185" width="30" height="95" fill="#f97316"/>
    <text x="60" y="247" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">2</text>

    <text x="110" y="215" font-family="sans-serif" font-size="12" fill="#64748b">第1次递归后</text>
    <text x="110" y="240" font-family="monospace" font-size="15" fill="#1e293b">我是赖庆庆，年龄<tspan fill="#f97316" font-weight="bold">{{age}}</tspan>，性别{{sex}}</text>

    <text x="110" y="265" font-family="monospace" font-size="12" fill="#a855f7">reg.test(template) → true ✓</text>
    <text x="410" y="265" font-family="monospace" font-size="12" fill="#a855f7">reg.exec(template)[1] → "age"</text>
  </g>

  <!-- Arrow Step 2 → Step 3 -->
  <polygon points="400,282 415,287 400,292" fill="#f97316"/>
  <text x="435" y="290" font-family="sans-serif" font-size="11" fill="#f97316">replace(&#123;&#123;age&#125;&#125;, 17)</text>

  <!-- Step 3 -->
  <g>
    <rect x="30" y="300" width="740" height="95" rx="10" fill="white" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="30" y="300" width="60" height="95" rx="10" fill="#22c55e"/>
    <rect x="60" y="300" width="30" height="95" fill="#22c55e"/>
    <text x="60" y="362" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">3</text>

    <text x="110" y="330" font-family="sans-serif" font-size="12" fill="#64748b">第2次递归后（再替换 sex）</text>
    <text x="110" y="355" font-family="monospace" font-size="15" fill="#1e293b">我是赖庆庆，年龄17，性别男</text>

    <text x="110" y="380" font-family="monospace" font-size="12" fill="#22c55e">reg.test(template) → false ✗  （无更多占位符，返回）</text>
  </g>

  <!-- Recursive loop arrow on right side -->
  <g>
    <path d="M770 232 Q 785 232 785 275 Q 785 318 770 318" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3"/>
    <polygon points="770,232 780,227 780,237" fill="#a855f7"/>
    <text x="788" y="278" font-family="sans-serif" font-size="10" fill="#a855f7" transform="rotate(90, 788, 278)">递归调用 render()</text>
  </g>

  <!-- Output badge -->
  <rect x="250" y="420" width="300" height="36" rx="18" fill="#166534" opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="444" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#16a34a">✅ 最终输出：我是赖庆庆，年龄17，性别男</text>
</svg>
