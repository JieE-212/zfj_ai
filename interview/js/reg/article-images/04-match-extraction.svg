<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="scanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#6366f1;stop-opacity:0.8"/>
      <stop offset="80%" style="stop-color:#06b6d4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#scanBg)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="48" fill="#1e293b"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">📊 字符串提取 · match() + 全局匹配</text>

  <!-- Source string display -->
  <rect x="40" y="70" width="720" height="52" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="100" font-family="sans-serif" font-size="14" fill="#475569">原始字符串：</text>
  <text x="170" y="101" font-family="monospace" font-size="15" fill="#1e293b">价格是</text>
  <text x="240" y="101" font-family="monospace" font-size="15" font-weight="bold" fill="#3b82f6">100</text>
  <text x="280" y="101" font-family="monospace" font-size="15" fill="#1e293b">元，进价是</text>
  <text x="360" y="101" font-family="monospace" font-size="15" font-weight="bold" fill="#f97316">80</text>
  <text x="390" y="101" font-family="monospace" font-size="15" fill="#1e293b">元，赚了</text>
  <text x="455" y="101" font-family="monospace" font-size="15" font-weight="bold" fill="#22c55e">20</text>
  <text x="485" y="101" font-family="monospace" font-size="15" fill="#1e293b">元</text>

  <!-- Regex label -->
  <rect x="40" y="140" width="720" height="44" rx="6" fill="#312e81" opacity="0.08"/>
  <text x="60" y="167" font-family="sans-serif" font-size="13" fill="#475569">正则表达式：</text>
  <text x="170" y="167" font-family="monospace" font-size="18" font-weight="bold" fill="#6366f1">/\d+/g</text>

  <!-- Labels for regex parts -->
  <g font-family="sans-serif" font-size="11">
    <rect x="325" y="144" width="100" height="18" rx="3" fill="#e0e7ff"/>
    <text x="375" y="157" text-anchor="middle" fill="#4338ca">\d = 数字</text>

    <rect x="432" y="144" width="100" height="18" rx="3" fill="#fce7f3"/>
    <text x="482" y="157" text-anchor="middle" fill="#be185d">+ = 1次及以上</text>

    <rect x="539" y="144" width="90" height="18" rx="3" fill="#dcfce7"/>
    <text x="584" y="157" text-anchor="middle" fill="#15803d">g = 全局</text>
  </g>

  <!-- Scanning visualization -->
  <rect x="40" y="210" width="720" height="70" rx="6" fill="#1e293b"/>
  <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#94a3b8">🔍 正则引擎扫描过程</text>
  <!-- Scan beam -->
  <rect x="60" y="248" width="680" height="3" rx="1.5" fill="url(#scanLine)"/>
  <!-- Markers on scan beam -->
  <circle cx="205" cy="249.5" r="6" fill="#3b82f6" opacity="0.8"/>
  <text x="205" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#3b82f6">100✓</text>

  <circle cx="325" cy="249.5" r="6" fill="#f97316" opacity="0.8"/>
  <text x="325" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#f97316">80✓</text>

  <circle cx="420" cy="249.5" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="420" y="270" text-anchor="middle" font-family="monospace" font-size="10" fill="#22c55e">20✓</text>

  <!-- Result array -->
  <text x="400" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">📦 匹配结果</text>

  <rect x="150" y="325" width="500" height="60" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="175" y="360" font-family="monospace" font-size="14" fill="#64748b">result = [</text>
  <!-- 100 -->
  <rect x="280" y="332" width="90" height="44" rx="6" fill="#dbeafe"/>
  <text x="325" y="360" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#2563eb">100</text>
  <text x="380" y="360" font-family="monospace" font-size="14" fill="#64748b">,</text>
  <!-- 80 -->
  <rect x="395" y="332" width="90" height="44" rx="6" fill="#ffedd5"/>
  <text x="440" y="360" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ea580c">80</text>
  <text x="495" y="360" font-family="monospace" font-size="14" fill="#64748b">,</text>
  <!-- 20 -->
  <rect x="510" y="332" width="90" height="44" rx="6" fill="#dcfce7"/>
  <text x="555" y="360" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#16a34a">20</text>
  <text x="610" y="360" font-family="monospace" font-size="14" fill="#64748b">]</text>

  <!-- Annotation: without g -->
  <rect x="80" y="410" width="290" height="58" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="225" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">❌ 不加 g 会怎样？</text>
  <text x="225" y="454" text-anchor="middle" font-family="monospace" font-size="12" fill="#ef4444">match(/\d+/) → ['100']  // 匹配完第一个就停了</text>

  <!-- Annotation: without + -->
  <rect x="430" y="410" width="290" height="58" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="575" y="434" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">❌ 不加 + 会怎样？</text>
  <text x="575" y="454" text-anchor="middle" font-family="monospace" font-size="12" fill="#ef4444">match(/\d/g) → ['1','0','0','8','0','2','0']</text>

  <!-- Bottom decorative -->
  <rect x="0" y="496" width="800" height="4" fill="#6366f1" opacity="0.3"/>
</svg>
