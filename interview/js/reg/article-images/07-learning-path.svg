<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="step1g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="100%" style="stop-color:#cbd5e1"/>
    </linearGradient>
    <linearGradient id="step2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <linearGradient id="step3g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="step4g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="step5g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
    <linearGradient id="step6g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="stairShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#0f172a"/>
  <!-- Subtle dot pattern -->
  <g opacity="0.03" fill="white">
    <circle cx="40" cy="40" r="1.5"/><circle cx="90" cy="40" r="1.5"/><circle cx="140" cy="40" r="1.5"/>
    <circle cx="190" cy="40" r="1.5"/><circle cx="240" cy="40" r="1.5"/><circle cx="40" cy="90" r="1.5"/>
    <circle cx="40" cy="140" r="1.5"/><circle cx="40" cy="190" r="1.5"/><circle cx="40" cy="240" r="1.5"/>
    <circle cx="40" cy="340" r="1.5"/><circle cx="40" cy="390" r="1.5"/><circle cx="40" cy="440" r="1.5"/>
  </g>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0">🪜 正则表达式学习阶梯</text>
  <text x="400" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">自底向上，循序渐进</text>

  <!-- Staircase -->
  <!-- Step 1: 地基 — 字符类 & 量词 -->
  <g filter="url(#stairShadow)">
    <rect x="80" y="360" width="280" height="70" rx="8" fill="url(#step1g)"/>
    <rect x="80" y="360" width="8" height="70" rx="4" fill="#64748b"/>
    <text x="100" y="387" font-family="monospace" font-size="18" font-weight="bold" fill="#1e293b">① [] 字符类 &amp; {} 量词</text>
    <text x="100" y="415" font-family="sans-serif" font-size="12" fill="#334155">正则的"砖块" —— 定范围和重复次数</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#stairShadow)">
    <rect x="200" y="298" width="280" height="62" rx="8" fill="url(#step2g)"/>
    <rect x="200" y="298" width="8" height="62" rx="4" fill="#475569"/>
    <text x="220" y="322" font-family="monospace" font-size="16" font-weight="bold" fill="white">② 锚点 ^ 和 $</text>
    <text x="220" y="347" font-family="sans-serif" font-size="11" fill="#f1f5f9">很多人正则写对了却匹配不对，就错在没加锚点 🔒</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#stairShadow)">
    <rect x="320" y="236" width="280" height="62" rx="8" fill="url(#step3g)"/>
    <rect x="320" y="236" width="8" height="62" rx="4" fill="#4f46e5"/>
    <text x="340" y="260" font-family="monospace" font-size="16" font-weight="bold" fill="white">③ 分组 () 与引用</text>
    <text x="340" y="285" font-family="sans-serif" font-size="11" fill="#e0e7ff">⚠️ 正则从"能用"到"好用"的分水岭</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#stairShadow)">
    <rect x="440" y="174" width="280" height="62" rx="8" fill="url(#step4g)"/>
    <rect x="440" y="174" width="8" height="62" rx="4" fill="#6d28d9"/>
    <text x="460" y="198" font-family="monospace" font-size="16" font-weight="bold" fill="white">④ 修饰符 g / i / m</text>
    <text x="460" y="223" font-family="sans-serif" font-size="11" fill="#ede9fe">全局、大小写、多行模式 🚩</text>
  </g>

  <!-- Step 5 — Gold, top -->
  <g filter="url(#stairShadow)">
    <rect x="520" y="112" width="250" height="62" rx="8" fill="url(#step6g)"/>
    <rect x="520" y="112" width="8" height="62" rx="4" fill="#b45309"/>
    <text x="540" y="136" font-family="monospace" font-size="16" font-weight="bold" fill="#1e293b">⑤ 项目实战 🚀</text>
    <text x="540" y="161" font-family="sans-serif" font-size="11" fill="#451a03">在实际项目中去写，正则才能真正内化</text>
  </g>

  <!-- Right side: key tips per step -->
  <!-- Step 1 tips -->
  <text x="590" y="395" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 注意：[] 内是"或"关系</text>
  <text x="590" y="411" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 {n} 精确n次 {n,} 至少n次</text>

  <!-- Step 2 tips -->
  <text x="590" y="333" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 ^匹配开头 $匹配结尾</text>
  <text x="590" y="349" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 锚点零宽度，不消耗字符</text>

  <!-- Step 3 tips -->
  <text x="590" y="271" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 () 不改变匹配，但捕获子串</text>
  <text x="590" y="287" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 用 $1 $2 引用，或回调取参</text>

  <!-- Step 4 tips -->
  <text x="590" y="209" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 g 全局 i 忽略大小写 m 多行</text>
  <text x="590" y="225" font-family="sans-serif" font-size="10" fill="#94a3b8">📎 组合使用：/pattern/gim</text>

  <!-- Step 5 tips -->
  <text x="590" y="147" font-family="sans-serif" font-size="10" fill="#fbbf24">📎 推荐工具：regex101.com</text>
  <text x="590" y="163" font-family="sans-serif" font-size="10" fill="#fbbf24">📎 掌握后进阶：零宽断言、反向引用</text>

  <!-- Climbing figure emoji -->
  <text x="90" y="350" font-family="sans-serif" font-size="28">🧗</text>

  <!-- Bottom quote -->
  <text x="400" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">"正则表达式不是用脑子记的，是用手写会的。"</text>
</svg>
