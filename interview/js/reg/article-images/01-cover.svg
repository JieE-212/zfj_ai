<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines (tech feel) -->
  <g opacity="0.05" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Floating code symbols in background -->
  <g opacity="0.15" fill="#6366f1" font-family="monospace" font-size="20">
    <text x="80" y="120">{}</text>
    <text x="250" y="480">[]</text>
    <text x="900" y="150">\d</text>
    <text x="1050" y="400">\w</text>
    <text x="150" y="350">^$</text>
    <text x="700" y="520">()</text>
    <text x="500" y="80">+*?</text>
    <text x="1100" y="550">\b</text>
  </g>

  <!-- Floating digits -->
  <g opacity="0.1" fill="#06b6d4" font-family="monospace" font-size="28">
    <text x="100" y="250">3</text>
    <text x="350" y="180">7</text>
    <text x="1000" y="300">9</text>
    <text x="850" y="100">5</text>
    <text x="200" y="550">1</text>
    <text x="600" y="420">8</text>
    <text x="750" y="250">4</text>
  </g>

  <!-- Central glowing regex -->
  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="64" font-weight="bold" fill="url(#glow)" filter="url(#bigGlow)">/^1[3-9]\d{9}$/</text>

  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#94a3b8" letter-spacing="6">
    从零掌握 JavaScript 正则表达式
  </text>

  <!-- Bottom decorative line -->
  <rect x="400" y="370" width="400" height="2" rx="1" fill="url(#glow)" opacity="0.5"/>

  <!-- Bottom tags -->
  <g font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    <text x="450" y="420"># JavaScript</text>
    <text x="600" y="420"># 正则表达式</text>
    <text x="750" y="420"># 前端面试</text>
  </g>

  <!-- Animated-like sparkle dots -->
  <circle cx="200" cy="180" r="2" fill="#fbbf24" opacity="0.8" filter="url(#glowFilter)"/>
  <circle cx="350" cy="430" r="1.5" fill="#a855f7" opacity="0.6" filter="url(#glowFilter)"/>
  <circle cx="850" cy="190" r="2" fill="#06b6d4" opacity="0.7" filter="url(#glowFilter)"/>
  <circle cx="950" cy="460" r="1.5" fill="#fbbf24" opacity="0.5" filter="url(#glowFilter)"/>
  <circle cx="150" cy="500" r="1" fill="#a855f7" opacity="0.8" filter="url(#glowFilter)"/>
  <circle cx="1050" cy="200" r="1.5" fill="#06b6d4" opacity="0.6" filter="url(#glowFilter)"/>

  <!-- Bottom sparkle bar -->
  <rect x="300" y="530" width="600" height="1" rx="0.5" fill="#6366f1" opacity="0.2"/>
  <circle cx="300" cy="530.5" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="600" cy="530.5" r="3" fill="#06b6d4" opacity="0.6"/>
  <circle cx="900" cy="530.5" r="3" fill="#fbbf24" opacity="0.6"/>
</svg>
