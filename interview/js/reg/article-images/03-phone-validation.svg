<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="phBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#phBg)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0">手机号正则验证 · 逐步拆解</text>

  <!-- Phone input mockup -->
  <rect x="50" y="65" width="250" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="88" font-family="monospace" font-size="11" fill="#64748b">📱 请输入手机号</text>
  <text x="75" y="108" font-family="monospace" font-size="18" font-weight="bold" fill="#22c55e">13888888888</text>
  <text x="270" y="108" font-family="monospace" font-size="14" fill="#22c55e">✓</text>

  <!-- Regex parts breakdown -->
  <g filter="url(#shadow)">
    <!-- Step 1: ^ -->
    <rect x="50" y="150" width="140" height="65" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="120" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#a5b4fc">^</text>
    <text x="120" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">🔒 字符串开头</text>

    <!-- Step 2: 1 -->
    <rect x="210" y="150" width="140" height="65" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="280" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#f87171">1</text>
    <text x="280" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">第1位：必须是 1</text>

    <!-- Step 3: [3-9] -->
    <rect x="370" y="150" width="140" height="65" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="440" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#fb923c">[3-9]</text>
    <text x="440" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">第2位：不可 0/1/2</text>

    <!-- Step 4: \d{9} -->
    <rect x="530" y="150" width="140" height="65" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="600" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#4ade80">\d{9}</text>
    <text x="600" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">剩余9位任意数字</text>

    <!-- Step 5: $ -->
    <rect x="690" y="150" width="60" height="65" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="720" y="175" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#a5b4fc">$</text>
    <text x="720" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">结尾</text>
  </g>

  <!-- Arrows between steps -->
  <g fill="#475569">
    <polygon points="195,182 208,174 208,190"/>
    <polygon points="355,182 368,174 368,190"/>
    <polygon points="515,182 528,174 528,190"/>
    <polygon points="675,182 688,174 688,190"/>
  </g>

  <!-- Bottom: test results -->
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">测试用例验证</text>

  <!-- Pass cases -->
  <rect x="50" y="280" width="700" height="38" rx="6" fill="#166534" opacity="0.4"/>
  <text x="70" y="304" font-family="monospace" font-size="13" fill="#22c55e">✓</text>
  <text x="95" y="304" font-family="monospace" font-size="13" fill="#4ade80">reg.test('13888888888')</text>
  <text x="330" y="304" font-family="monospace" font-size="13" fill="#22c55e">→ true</text>
  <text x="420" y="304" font-family="monospace" font-size="13" fill="#4ade80">reg.test('19912345678')</text>
  <text x="660" y="304" font-family="monospace" font-size="13" fill="#22c55e">→ true</text>

  <!-- Fail cases -->
  <rect x="50" y="330" width="700" height="38" rx="6" fill="#7f1d1d" opacity="0.4"/>
  <text x="70" y="354" font-family="monospace" font-size="13" fill="#ef4444">✗</text>
  <text x="95" y="354" font-family="monospace" font-size="13" fill="#f87171">reg.test('12888888888')</text>
  <text x="340" y="354" font-family="monospace" font-size="13" fill="#ef4444">→ false</text>
  <text x="440" y="354" font-family="monospace" font-size="12" fill="#64748b">(第2位是2)</text>

  <rect x="50" y="378" width="700" height="38" rx="6" fill="#7f1d1d" opacity="0.4"/>
  <text x="70" y="402" font-family="monospace" font-size="13" fill="#ef4444">✗</text>
  <text x="95" y="402" font-family="monospace" font-size="13" fill="#f87171">reg.test('1388888888')</text>
  <text x="330" y="402" font-family="monospace" font-size="13" fill="#ef4444">→ false</text>
  <text x="440" y="402" font-family="monospace" font-size="12" fill="#64748b">(只有10位)</text>

  <rect x="50" y="426" width="700" height="38" rx="6" fill="#7f1d1d" opacity="0.4"/>
  <text x="70" y="450" font-family="monospace" font-size="13" fill="#ef4444">✗</text>
  <text x="95" y="450" font-family="monospace" font-size="13" fill="#f87171">reg.test('invalid-input')</text>
  <text x="355" y="450" font-family="monospace" font-size="13" fill="#ef4444">→ false</text>
  <text x="440" y="450" font-family="monospace" font-size="12" fill="#64748b">(完全不是数字)</text>

  <!-- Key insight box -->
  <rect x="150" y="490" width="500" height="80" rx="10" fill="#312e81" opacity="0.5" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="518" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#c7d2fe">💡 关键提示</text>
  <text x="400" y="542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a5b4fc">若不加 ^ 和 $，正则只检查字符串中是否包含匹配的子串</text>
  <text x="400" y="560" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a5b4fc">例如 'abc13888888888xyz' 也会通过 test()，造成安全漏洞</text>
</svg>
