<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c2d"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6c5ce7" stop-opacity="0.3"/>
      <stop offset="100%" style="stop-color:#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#6c5ce7" flood-opacity="0.5"/>
    </filter>
    <filter id="chGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="ray1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ray2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0984e3"/>
      <stop offset="100%" style="stop-color:#74b9ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ray3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ray4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e17055"/>
      <stop offset="100%" style="stop-color:#fab1a0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg6)"/>
  <circle cx="600" cy="340" r="250" fill="url(#centerGlow)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="24" font-weight="bold">一键发布 · 全渠道触达</text>
  <text x="600" y="68" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="13">一个 Agent，多端运行 — Web / IM / API / 企业应用全覆盖</text>

  <!-- Central Agent Node -->
  <g transform="translate(600, 340)" filter="url(#nodeGlow)">
    <!-- Outer rings -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#6c5ce7" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#a29bfe" stroke-width="0.5" opacity="0.4" stroke-dasharray="6,3"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.5"/>

    <!-- Robot icon circle -->
    <circle cx="0" cy="0" r="36" fill="#1a1040" stroke="#a29bfe" stroke-width="2"/>

    <!-- Simple robot face -->
    <g transform="translate(0, -4)">
      <!-- Eyes -->
      <circle cx="-10" cy="-3" r="4" fill="#00cec9"/>
      <circle cx="10" cy="-3" r="4" fill="#00cec9"/>
      <!-- Smile -->
      <path d="M-8,6 Q0,14 8,6" fill="none" stroke="#00cec9" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Antenna -->
      <line x1="0" y1="-18" x2="0" y2="-24" stroke="#a29bfe" stroke-width="1.5"/>
      <circle cx="0" cy="-26" r="2.5" fill="#fdcb6e"/>
    </g>

    <!-- Label -->
    <text x="0" y="62" text-anchor="middle" fill="#a29bfe" font-family="sans-serif" font-size="15" font-weight="bold">AI Agent</text>
    <text x="0" y="80" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="11">课程客服智能体</text>
  </g>

  <!-- Connection rays -->
  <!-- Ray to Web (top-right) -->
  <g opacity="0.6">
    <line x1="640" y1="310" x2="920" y2="160" stroke="url(#ray1)" stroke-width="1.5"/>
    <circle cx="780" cy="235" r="2" fill="#6c5ce7"/>
    <circle cx="840" cy="195" r="2.5" fill="#a29bfe"/>
  </g>

  <!-- Ray to API (bottom-right) -->
  <g opacity="0.6">
    <line x1="640" y1="370" x2="920" y2="520" stroke="url(#ray2)" stroke-width="1.5"/>
    <circle cx="780" cy="445" r="2" fill="#0984e3"/>
    <circle cx="840" cy="485" r="2.5" fill="#74b9ff"/>
  </g>

  <!-- Ray to WeChat (bottom-left) -->
  <g opacity="0.6">
    <line x1="560" y1="370" x2="280" y2="520" stroke="url(#ray3)" stroke-width="1.5"/>
    <circle cx="420" cy="445" r="2" fill="#00b894"/>
    <circle cx="360" cy="485" r="2.5" fill="#55efc4"/>
  </g>

  <!-- Ray to Lark (top-left) -->
  <g opacity="0.6">
    <line x1="560" y1="310" x2="280" y2="160" stroke="url(#ray4)" stroke-width="1.5"/>
    <circle cx="420" cy="235" r="2" fill="#e17055"/>
    <circle cx="360" cy="195" r="2.5" fill="#fab1a0"/>
  </g>

  <!-- Channel 1: Web (top-right) -->
  <g transform="translate(980, 130)" filter="url(#chGlow)">
    <rect x="-60" y="-45" width="120" height="90" rx="14" fill="#1a1040" stroke="#6c5ce7" stroke-width="1.5"/>
    <!-- Browser icon -->
    <rect x="-18" y="-15" width="36" height="28" rx="4" fill="none" stroke="#a29bfe" stroke-width="2"/>
    <line x1="-18" y1="5" x2="18" y2="5" stroke="#a29bfe" stroke-width="1.5"/>
    <circle cx="-6" cy="-3" r="1.5" fill="#a29bfe" opacity="0.5"/>
    <circle cx="0" cy="-3" r="1.5" fill="#a29bfe" opacity="0.5"/>
    <circle cx="6" cy="-3" r="1.5" fill="#a29bfe" opacity="0.5"/>
    <text x="0" y="32" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">Web 网页</text>
    <text x="0" y="48" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">嵌入官网 / H5</text>
  </g>

  <!-- Channel 2: Lark (top-left) -->
  <g transform="translate(220, 130)" filter="url(#chGlow)">
    <rect x="-60" y="-45" width="120" height="90" rx="14" fill="#1a1040" stroke="#e17055" stroke-width="1.5"/>
    <!-- Chat icon -->
    <rect x="-16" y="-16" width="32" height="24" rx="6" fill="none" stroke="#fab1a0" stroke-width="2"/>
    <polygon points="-8,8 0,16 8,8" fill="none" stroke="#fab1a0" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="32" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">飞书</text>
    <text x="0" y="48" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">Lark / 企业协作</text>
  </g>

  <!-- Channel 3: WeChat (bottom-left) -->
  <g transform="translate(220, 550)" filter="url(#chGlow)">
    <rect x="-60" y="-45" width="120" height="90" rx="14" fill="#1a1040" stroke="#00b894" stroke-width="1.5"/>
    <!-- WeChat bubble -->
    <rect x="-16" y="-16" width="32" height="24" rx="8" fill="none" stroke="#55efc4" stroke-width="2"/>
    <polygon points="-8,8 0,16 8,8" fill="none" stroke="#55efc4" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="32" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">微信客服</text>
    <text x="0" y="48" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">公众号 / 小程序</text>
  </g>

  <!-- Channel 4: API (bottom-right) -->
  <g transform="translate(980, 550)" filter="url(#chGlow)">
    <rect x="-60" y="-45" width="120" height="90" rx="14" fill="#1a1040" stroke="#0984e3" stroke-width="1.5"/>
    <!-- API gear/bracket -->
    <g>
      <path d="M-12,-10 L-4,-10 L-4,-14 L4,-14 L4,-10 L12,-10" fill="none" stroke="#74b9ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12,10 L4,10 L4,14 L-4,14 L-4,10 L-12,10" fill="none" stroke="#74b9ff" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#74b9ff" stroke-width="1.5"/>
    </g>
    <text x="0" y="32" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">API 接口</text>
    <text x="0" y="48" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">自定义集成</text>
  </g>

  <!-- Bottom note -->
  <rect x="350" y="640" width="500" height="2" rx="1" fill="#6c5ce7" opacity="0.2"/>
</svg>
