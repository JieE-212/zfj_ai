<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0984e3"/>
      <stop offset="100%" style="stop-color:#74b9ff"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e17055"/>
      <stop offset="100%" style="stop-color:#fab1a0"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="24" font-weight="bold">RAG 检索增强生成流程</text>
  <text x="600" y="68" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="13">Retrieval Augmented Generation — 让大模型基于你的知识说话</text>

  <!-- Step 1: User Question -->
  <g transform="translate(118, 230)" filter="url(#cardShadow)">
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="#fff"/>
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="url(#step1)" opacity="0.06"/>
    <!-- Step number -->
    <circle cx="0" cy="-65" r="16" fill="url(#step1)"/>
    <text x="0" y="-60" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">1</text>
    <!-- User silhouette icon -->
    <circle cx="0" cy="-18" r="22" fill="none" stroke="#6c5ce7" stroke-width="2.5"/>
    <path d="M-10,5 Q-10,20 0,22 Q10,20 10,5" fill="none" stroke="#6c5ce7" stroke-width="2.5"/>
    <!-- Question mark -->
    <text x="22" y="-22" fill="#6c5ce7" font-family="sans-serif" font-size="22" font-weight="bold">?</text>
    <text x="0" y="55" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="16" font-weight="bold">用户提问</text>
    <text x="0" y="75" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="11">User Query</text>
  </g>

  <!-- Arrow 1→2 -->
  <g opacity="0.7">
    <line x1="208" y1="320" x2="290" y2="320" stroke="#6c5ce7" stroke-width="2.5"/>
    <polygon points="290,315 300,320 290,325" fill="#6c5ce7"/>
  </g>

  <!-- Step 2: Knowledge Search -->
  <g transform="translate(430, 230)" filter="url(#cardShadow)">
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="#fff"/>
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="url(#step2)" opacity="0.06"/>
    <circle cx="0" cy="-65" r="16" fill="url(#step2)"/>
    <text x="0" y="-60" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">2</text>
    <!-- Search icon: magnifying glass + doc -->
    <g transform="translate(0,-18)">
      <rect x="-18" y="-15" width="24" height="30" rx="3" fill="none" stroke="#0984e3" stroke-width="2"/>
      <line x1="-10" y1="-5" x2="0" y2="-5" stroke="#0984e3" stroke-width="1.5" opacity="0.5"/>
      <line x1="-10" y1="3" x2="0" y2="3" stroke="#0984e3" stroke-width="1.5" opacity="0.5"/>
      <line x1="-10" y1="11" x2="-2" y2="11" stroke="#0984e3" stroke-width="1.5" opacity="0.5"/>
      <!-- Magnifying glass -->
      <circle cx="10" cy="-18" r="10" fill="none" stroke="#0984e3" stroke-width="2.5"/>
      <line x1="17" y1="-11" x2="24" y2="-4" stroke="#0984e3" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="0" y="55" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="16" font-weight="bold">知识库检索</text>
    <text x="0" y="75" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="11">Vector Search</text>
  </g>

  <!-- Arrow 2→3 -->
  <g opacity="0.7">
    <line x1="520" y1="320" x2="602" y2="320" stroke="#0984e3" stroke-width="2.5"/>
    <polygon points="602,315 612,320 602,325" fill="#0984e3"/>
  </g>

  <!-- Step 3: Context Extraction -->
  <g transform="translate(742, 230)" filter="url(#cardShadow)">
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="#fff"/>
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="url(#step3)" opacity="0.06"/>
    <circle cx="0" cy="-65" r="16" fill="url(#step3)"/>
    <text x="0" y="-60" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">3</text>
    <!-- Document fragments -->
    <g transform="translate(0,-18)">
      <rect x="-12" y="-12" width="24" height="18" rx="2" fill="none" stroke="#e17055" stroke-width="1.5" opacity="0.6"/>
      <rect x="-8" y="-8" width="16" height="10" rx="1" fill="#e17055" opacity="0.2"/>
      <rect x="-6" y="-4" width="12" height="1.5" fill="#e17055" opacity="0.3"/>
      <rect x="-6" y="0" width="8" height="1.5" fill="#e17055" opacity="0.3"/>
      <!-- Floating fragments -->
      <rect x="15" y="-20" width="10" height="8" rx="1" fill="#e17055" opacity="0.15" transform="rotate(15)"/>
      <rect x="-30" y="-15" width="10" height="8" rx="1" fill="#e17055" opacity="0.15" transform="rotate(-10)"/>
      <rect x="20" y="5" width="10" height="8" rx="1" fill="#e17055" opacity="0.12" transform="rotate(20)"/>
    </g>
    <text x="0" y="55" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="16" font-weight="bold">内容提取</text>
    <text x="0" y="75" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="11">Context Chunks</text>
  </g>

  <!-- Arrow 3→4 -->
  <g opacity="0.7">
    <line x1="832" y1="320" x2="914" y2="320" stroke="#e17055" stroke-width="2.5"/>
    <polygon points="914,315 924,320 914,325" fill="#e17055"/>
  </g>

  <!-- Step 4: LLM Answer -->
  <g transform="translate(1054, 230)" filter="url(#cardShadow)">
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="#fff"/>
    <rect x="-90" y="-90" width="180" height="180" rx="16" fill="url(#step4)" opacity="0.06"/>
    <circle cx="0" cy="-65" r="16" fill="url(#step4)"/>
    <text x="0" y="-60" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">4</text>
    <!-- Brain + output -->
    <g transform="translate(0,-18)">
      <ellipse cx="0" cy="-5" rx="16" ry="12" fill="none" stroke="#00b894" stroke-width="2"/>
      <path d="M-8,-8 Q-4,-15 0,-13 Q4,-15 8,-8" fill="none" stroke="#00b894" stroke-width="1.5"/>
      <!-- Checkmark -->
      <path d="M15,-2 L20,3 L28,-6" fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="50" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="16" font-weight="bold">LLM 生成回答</text>
    <text x="0" y="70" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="11">Generate Response</text>
  </g>

  <!-- Bottom explanation bar -->
  <rect x="80" y="470" width="1040" height="110" rx="12" fill="#fff" filter="url(#cardShadow)" opacity="0.9"/>

  <!-- Flow summary in bottom bar -->
  <g transform="translate(600, 500)">
    <!-- Compact flow -->
    <g transform="translate(-450, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="url(#step1)" opacity="0.9"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">用户提问</text>
    </g>
    <text x="-335" y="6" fill="#b2bec3" font-family="sans-serif" font-size="18">→</text>

    <g transform="translate(-195, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="url(#step2)" opacity="0.9"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">语义检索</text>
    </g>
    <text x="-80" y="6" fill="#b2bec3" font-family="sans-serif" font-size="18">→</text>

    <g transform="translate(60, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="url(#step3)" opacity="0.9"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">上下文注入</text>
    </g>
    <text x="175" y="6" fill="#b2bec3" font-family="sans-serif" font-size="18">→</text>

    <g transform="translate(315, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="url(#step4)" opacity="0.9"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">精准回答</text>
    </g>
  </g>

  <text x="600" y="560" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">
    用户问题 → 向量检索匹配知识库内容 → 提取相关片段注入 Prompt → LLM 基于上下文生成可靠回答
  </text>
</svg>
