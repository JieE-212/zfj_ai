<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    <filter id="card5Shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e17055"/>
      <stop offset="100%" style="stop-color:#fab1a0"/>
    </linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0984e3"/>
      <stop offset="100%" style="stop-color:#74b9ff"/>
    </linearGradient>
    <linearGradient id="c5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9"/>
      <stop offset="100%" style="stop-color:#81ecec"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg5)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="24" font-weight="bold">Coze 知识库：五大类型全覆盖</text>
  <text x="600" y="68" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="13">从文档到数据库，一站式接入你的私有知识</text>

  <!-- Card 1: Text -->
  <g transform="translate(70, 110)" filter="url(#card5Shadow)">
    <rect x="0" y="0" width="310" height="250" rx="16" fill="#fff"/>
    <!-- Color bar -->
    <rect x="0" y="0" width="310" height="6" rx="3" fill="url(#c1)"/>
    <!-- Icon -->
    <g transform="translate(155, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#c1)" opacity="0.12"/>
      <!-- Document icon -->
      <rect x="-15" y="-20" width="30" height="38" rx="3" fill="none" stroke="#00b894" stroke-width="2.5"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#00b894" stroke-width="1.5" opacity="0.4"/>
      <line x1="-8" y1="-1" x2="8" y2="-1" stroke="#00b894" stroke-width="1.5" opacity="0.4"/>
      <line x1="-8" y1="6" x2="4" y2="6" stroke="#00b894" stroke-width="1.5" opacity="0.4"/>
      <!-- Corner fold -->
      <path d="M15,-20 L15,-8 L27,-8" fill="none" stroke="#00b894" stroke-width="1.5" opacity="0.4"/>
    </g>
    <text x="155" y="129" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="18" font-weight="bold">📄 文本知识</text>
    <text x="155" y="155" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">Text Documents</text>
    <!-- Format badges -->
    <g transform="translate(50, 175)">
      <rect x="0" y="0" width="55" height="24" rx="12" fill="#00b894" opacity="0.1"/>
      <text x="27" y="16" text-anchor="middle" fill="#00b894" font-family="sans-serif" font-size="11">.txt</text>
      <rect x="65" y="0" width="55" height="24" rx="12" fill="#00b894" opacity="0.1"/>
      <text x="92" y="16" text-anchor="middle" fill="#00b894" font-family="sans-serif" font-size="11">.docx</text>
      <rect x="130" y="0" width="55" height="24" rx="12" fill="#00b894" opacity="0.1"/>
      <text x="157" y="16" text-anchor="middle" fill="#00b894" font-family="sans-serif" font-size="11">.pdf</text>
    </g>
  </g>

  <!-- Card 2: Excel -->
  <g transform="translate(425, 110)" filter="url(#card5Shadow)">
    <rect x="0" y="0" width="310" height="250" rx="16" fill="#fff"/>
    <rect x="0" y="0" width="310" height="6" rx="3" fill="url(#c2)"/>
    <g transform="translate(155, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#c2)" opacity="0.12"/>
      <!-- Table icon -->
      <rect x="-20" y="-18" width="40" height="36" rx="3" fill="none" stroke="#e17055" stroke-width="2.5"/>
      <line x1="-20" y1="-6" x2="20" y2="-6" stroke="#e17055" stroke-width="1.5" opacity="0.4"/>
      <line x1="-20" y1="6" x2="20" y2="6" stroke="#e17055" stroke-width="1.5" opacity="0.4"/>
      <line x1="-6" y1="-18" x2="-6" y2="18" stroke="#e17055" stroke-width="1.5" opacity="0.4"/>
      <line x1="6" y1="-18" x2="6" y2="18" stroke="#e17055" stroke-width="1.5" opacity="0.4"/>
    </g>
    <text x="155" y="129" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="18" font-weight="bold">📊 表格数据</text>
    <text x="155" y="155" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">Spreadsheet Data</text>
    <g transform="translate(80, 175)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#e17055" opacity="0.1"/>
      <text x="35" y="16" text-anchor="middle" fill="#e17055" font-family="sans-serif" font-size="11">.xlsx</text>
      <rect x="80" y="0" width="70" height="24" rx="12" fill="#e17055" opacity="0.1"/>
      <text x="115" y="16" text-anchor="middle" fill="#e17055" font-family="sans-serif" font-size="11">.csv</text>
    </g>
  </g>

  <!-- Card 3: Online -->
  <g transform="translate(780, 110)" filter="url(#card5Shadow)">
    <rect x="0" y="0" width="310" height="250" rx="16" fill="#fff"/>
    <rect x="0" y="0" width="310" height="6" rx="3" fill="url(#c3)"/>
    <g transform="translate(155, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#c3)" opacity="0.12"/>
      <!-- Globe icon -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#6c5ce7" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="7" ry="18" fill="none" stroke="#6c5ce7" stroke-width="1.5" opacity="0.4"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#6c5ce7" stroke-width="1.5" opacity="0.4"/>
    </g>
    <text x="155" y="129" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="18" font-weight="bold">🌐 在线数据</text>
    <text x="155" y="155" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">Online Data Sources</text>
    <g transform="translate(80, 180)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#6c5ce7" opacity="0.1"/>
      <text x="35" y="16" text-anchor="middle" fill="#6c5ce7" font-family="sans-serif" font-size="11">网页抓取</text>
      <rect x="80" y="0" width="70" height="24" rx="12" fill="#6c5ce7" opacity="0.1"/>
      <text x="115" y="16" text-anchor="middle" fill="#6c5ce7" font-family="sans-serif" font-size="11">API接入</text>
    </g>
  </g>

  <!-- Card 4 & 5 (row 2) -->
  <!-- Card 4: Database -->
  <g transform="translate(250, 395)" filter="url(#card5Shadow)">
    <rect x="0" y="0" width="310" height="230" rx="16" fill="#fff"/>
    <rect x="0" y="0" width="310" height="6" rx="3" fill="url(#c4)"/>
    <g transform="translate(155, 50)">
      <circle cx="0" cy="0" r="30" fill="url(#c4)" opacity="0.12"/>
      <!-- Database icon -->
      <ellipse cx="0" cy="-12" rx="16" ry="6" fill="none" stroke="#0984e3" stroke-width="2.5"/>
      <path d="M-16,-12 L-16,12" stroke="#0984e3" stroke-width="2.5"/>
      <path d="M16,-12 L16,12" stroke="#0984e3" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#0984e3" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="0" cy="12" rx="16" ry="6" fill="none" stroke="#0984e3" stroke-width="1.5" opacity="0.4"/>
    </g>
    <text x="155" y="120" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="18" font-weight="bold">🗄️ 数据库</text>
    <text x="155" y="146" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">Database Integration</text>
    <g transform="translate(80, 165)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#0984e3" opacity="0.1"/>
      <text x="35" y="16" text-anchor="middle" fill="#0984e3" font-family="sans-serif" font-size="11">MySQL</text>
      <rect x="80" y="0" width="70" height="24" rx="12" fill="#0984e3" opacity="0.1"/>
      <text x="115" y="16" text-anchor="middle" fill="#0984e3" font-family="sans-serif" font-size="11">PostgreSQL</text>
    </g>
  </g>

  <!-- Card 5: Enterprise -->
  <g transform="translate(605, 395)" filter="url(#card5Shadow)">
    <rect x="0" y="0" width="310" height="230" rx="16" fill="#fff"/>
    <rect x="0" y="0" width="310" height="6" rx="3" fill="url(#c5)"/>
    <g transform="translate(155, 50)">
      <circle cx="0" cy="0" r="30" fill="url(#c5)" opacity="0.12"/>
      <!-- Building/enterprise icon -->
      <rect x="-14" y="-15" width="28" height="30" rx="2" fill="none" stroke="#00cec9" stroke-width="2.5"/>
      <line x1="0" y1="-15" x2="0" y2="-22" stroke="#00cec9" stroke-width="2"/>
      <rect x="-5" y="-5" width="10" height="10" rx="1" fill="none" stroke="#00cec9" stroke-width="1" opacity="0.4"/>
      <rect x="-5" y="8" width="10" height="7" rx="1" fill="none" stroke="#00cec9" stroke-width="1" opacity="0.4"/>
    </g>
    <text x="155" y="120" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="18" font-weight="bold">🏢 企业系统</text>
    <text x="155" y="146" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">Enterprise Integration</text>
    <g transform="translate(80, 170)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#00cec9" opacity="0.1"/>
      <text x="35" y="16" text-anchor="middle" fill="#00cec9" font-family="sans-serif" font-size="11">飞书</text>
      <rect x="80" y="0" width="70" height="24" rx="12" fill="#00cec9" opacity="0.1"/>
      <text x="115" y="16" text-anchor="middle" fill="#00cec9" font-family="sans-serif" font-size="11">企业微信</text>
    </g>
  </g>
</svg>
