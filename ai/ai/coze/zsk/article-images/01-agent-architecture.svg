<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#0d0d3a"/>
    </linearGradient>
    <linearGradient id="brainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#6c5ce7" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="500" x2="1200" y2="500"/><line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="650" x2="1200" y2="650"/>
  </g>

  <!-- Central Brain (LLM) -->
  <g transform="translate(600, 180)" filter="url(#glow)">
    <!-- Brain outer glow circle -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#6c5ce7" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#a29bfe" stroke-width="0.5" opacity="0.5" stroke-dasharray="8,4"/>

    <!-- Brain shape -->
    <ellipse cx="0" cy="0" rx="60" ry="50" fill="#1a1a4e" stroke="url(#brainGlow)" stroke-width="3"/>

    <!-- Brain convolutions -->
    <path d="M-25,-15 Q-10,-30 0,-20 Q10,-10 -5,0 Q-15,10 -30,5" fill="none" stroke="#a29bfe" stroke-width="2" opacity="0.8"/>
    <path d="M5,-15 Q20,-25 30,-15 Q35,-5 25,5 Q15,15 5,10" fill="none" stroke="#a29bfe" stroke-width="2" opacity="0.8"/>
    <path d="M-10,10 Q0,20 10,15 Q20,10 25,20" fill="none" stroke="#a29bfe" stroke-width="1.5" opacity="0.6"/>

    <!-- Brain center node -->
    <circle cx="0" cy="0" r="8" fill="#00cec9" opacity="0.9"/>

    <!-- Label -->
    <text x="0" y="75" text-anchor="middle" fill="#a29bfe" font-family="sans-serif" font-size="18" font-weight="bold">LLM 大脑</text>
    <text x="0" y="95" text-anchor="middle" fill="#6c5ce7" font-family="sans-serif" font-size="12">智能决策中心</text>
  </g>

  <!-- Connection lines from brain to modules -->
  <g opacity="0.7">
    <!-- Line to Tools (left) -->
    <path d="M540,200 Q400,180 300,350" fill="none" stroke="url(#neonLine)" stroke-width="2" stroke-dasharray="0"/>
    <circle cx="420" cy="210" r="4" fill="#6c5ce7" opacity="0.6"/>
    <circle cx="360" cy="260" r="3" fill="#00cec9" opacity="0.4"/>

    <!-- Line to Knowledge Base (center-left) -->
    <path d="M555,220 Q350,250 250,480" fill="none" stroke="url(#neonLine)" stroke-width="2"/>
    <circle cx="430" cy="270" r="4" fill="#6c5ce7" opacity="0.6"/>
    <circle cx="330" cy="400" r="3" fill="#00cec9" opacity="0.4"/>

    <!-- Line to Automation (center-right) -->
    <path d="M645,220 Q650,300 600,480" fill="none" stroke="url(#neonLine)" stroke-width="2"/>
    <circle cx="650" cy="350" r="3" fill="#00cec9" opacity="0.4"/>

    <!-- Line to Interface (right) -->
    <path d="M660,200 Q800,180 900,350" fill="none" stroke="url(#neonLine)" stroke-width="2"/>
    <circle cx="780" cy="210" r="4" fill="#6c5ce7" opacity="0.6"/>
    <circle cx="840" cy="260" r="3" fill="#00cec9" opacity="0.4"/>
  </g>

  <!-- Module 1: Tools (left) -->
  <g transform="translate(220, 350)" filter="url(#softGlow)">
    <rect x="-80" y="-50" width="160" height="100" rx="16" fill="#1a1a4e" stroke="#6c5ce7" stroke-width="1.5"/>
    <!-- Wrench icon -->
    <g transform="translate(0,-5)">
      <path d="M-15,-12 L10,13 L5,18 L-20,-7 Z" fill="none" stroke="#a29bfe" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-18" cy="-15" r="10" fill="none" stroke="#a29bfe" stroke-width="3"/>
    </g>
    <text x="0" y="35" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">工具调用</text>
    <text x="0" y="52" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">Tools / Plugins</text>
  </g>

  <!-- Module 2: Knowledge Base (center-left) -->
  <g transform="translate(220, 500)" filter="url(#softGlow)">
    <rect x="-80" y="-55" width="160" height="110" rx="16" fill="#1a1a4e" stroke="#00cec9" stroke-width="1.5"/>
    <!-- Book icon -->
    <g transform="translate(0,-10)">
      <path d="M-20,-20 L20,-20 L20,20 L0,15 L-20,20 Z" fill="none" stroke="#00cec9" stroke-width="2.5"/>
      <line x1="0" y1="-20" x2="0" y2="15" stroke="#00cec9" stroke-width="1.5"/>
      <line x1="-12" y1="-8" x2="-3" y2="-10" stroke="#00cec9" stroke-width="1" opacity="0.5"/>
      <line x1="-12" y1="-1" x2="-3" y2="-3" stroke="#00cec9" stroke-width="1" opacity="0.5"/>
      <line x1="-12" y1="6" x2="-3" y2="4" stroke="#00cec9" stroke-width="1" opacity="0.5"/>
    </g>
    <text x="0" y="32" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">知识库</text>
    <text x="0" y="49" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">Knowledge Base (RAG)</text>
  </g>

  <!-- Module 3: Automation (center-right) -->
  <g transform="translate(600, 520)" filter="url(#softGlow)">
    <rect x="-80" y="-55" width="160" height="110" rx="16" fill="#1a1a4e" stroke="#fdcb6e" stroke-width="1.5"/>
    <!-- Gear icon -->
    <g transform="translate(0,-10)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#fdcb6e" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#fdcb6e" stroke-width="1.5"/>
      <path d="M0,-18 L0,-22 M0,18 L0,22 M-18,0 L-22,0 M18,0 L22,0" stroke="#fdcb6e" stroke-width="2"/>
      <path d="M-13,-13 L-16,-16 M13,13 L16,16 M-13,13 L-16,16 M13,-13 L16,-16" stroke="#fdcb6e" stroke-width="2"/>
    </g>
    <text x="0" y="32" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">任务自动化</text>
    <text x="0" y="49" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">Workflow / Actions</text>
  </g>

  <!-- Module 4: Interface (right) -->
  <g transform="translate(980, 350)" filter="url(#softGlow)">
    <rect x="-80" y="-50" width="160" height="100" rx="16" fill="#1a1a4e" stroke="#fd79a8" stroke-width="1.5"/>
    <!-- Chat bubble icon -->
    <g transform="translate(0,-5)">
      <rect x="-18" y="-18" width="36" height="26" rx="8" fill="none" stroke="#fd79a8" stroke-width="2.5"/>
      <polygon points="-10,8 0,18 10,8" fill="none" stroke="#fd79a8" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="-6" cy="-5" r="2.5" fill="#fd79a8" opacity="0.5"/>
      <circle cx="2" cy="-5" r="2.5" fill="#fd79a8" opacity="0.5"/>
      <circle cx="10" cy="-5" r="2.5" fill="#fd79a8" opacity="0.5"/>
    </g>
    <text x="0" y="35" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="14" font-weight="bold">交互界面</text>
    <text x="0" y="52" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">Chat / Multi-channel</text>
  </g>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="22" font-weight="bold">AI Agent 智能体架构</text>
  <text x="600" y="68" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="12">大模型（大脑）+ 工具链（手脚）= 能自主执行任务的 AI 实体</text>

  <!-- Decorative particles -->
  <g opacity="0.3">
    <circle cx="100" cy="100" r="1.5" fill="#6c5ce7"/>
    <circle cx="1100" cy="80" r="1.5" fill="#00cec9"/>
    <circle cx="50" cy="500" r="1.5" fill="#a29bfe"/>
    <circle cx="1150" cy="550" r="1.5" fill="#fd79a8"/>
    <circle cx="400" cy="150" r="1" fill="#fdcb6e"/>
    <circle cx="800" cy="130" r="1" fill="#6c5ce7"/>
  </g>
</svg>
