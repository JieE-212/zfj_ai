<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f6fa"/>
      <stop offset="100%" style="stop-color:#dcdde1"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436"/>
      <stop offset="100%" style="stop-color:#1e272e"/>
    </linearGradient>
    <filter id="uiShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="btnGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#0984e3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg3)"/>

  <!-- Title bar (mock browser) -->
  <rect x="40" y="20" width="1120" height="635" rx="12" fill="#fff" filter="url(#uiShadow)"/>
  <rect x="40" y="20" width="1120" height="40" rx="12" fill="#dfe6e9"/>
  <rect x="40" y="32" width="1120" height="28" fill="#dfe6e9"/>
  <!-- Browser dots -->
  <circle cx="60" cy="40" r="5" fill="#ff7675"/>
  <circle cx="80" cy="40" r="5" fill="#fdcb6e"/>
  <circle cx="100" cy="40" r="5" fill="#00b894"/>
  <text x="600" y="44" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="11">Coze Studio — AI Agent 开发平台</text>

  <!-- Sidebar -->
  <rect x="40" y="60" width="200" height="595" rx="0" fill="url(#sidebar)"/>
  <!-- Sidebar items -->
  <g fill="#dfe6e9" font-family="sans-serif" font-size="12">
    <!-- Logo area -->
    <rect x="40" y="60" width="200" height="55" fill="#1e272e"/>
    <text x="140" y="95" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="bold">🤖 Coze</text>

    <!-- Menu items -->
    <rect x="55" y="125" width="170" height="32" rx="6" fill="#0984e3" opacity="0.2"/>
    <text x="75" y="146" fill="#74b9ff" font-family="sans-serif" font-size="12">📋 我的 Bot</text>

    <text x="75" y="175" fill="#b2bec3" font-family="sans-serif" font-size="12">🔌 插件市场</text>
    <text x="75" y="202" fill="#b2bec3" font-family="sans-serif" font-size="12">📚 知识库管理</text>
    <text x="75" y="229" fill="#b2bec3" font-family="sans-serif" font-size="12">🔄 工作流</text>
    <text x="75" y="256" fill="#b2bec3" font-family="sans-serif" font-size="12">💾 变量与记忆</text>
    <text x="75" y="283" fill="#b2bec3" font-family="sans-serif" font-size="12">📊 数据分析</text>

    <!-- Active indicator -->
    <rect x="40" y="125" width="3" height="32" rx="2" fill="#0984e3"/>
  </g>

  <!-- Main content area -->
  <!-- Section 1: Prompt Editor -->
  <rect x="260" y="75" width="540" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <rect x="260" y="75" width="540" height="36" rx="10" fill="#fff"/>
  <rect x="260" y="101" width="540" height="10" fill="#fff"/>
  <text x="280" y="99" fill="#2d3436" font-family="sans-serif" font-size="13" font-weight="bold">📝 Prompt 编辑器</text>

  <!-- Mock prompt text -->
  <g font-family="monospace" font-size="10">
    <text x="280" y="130" fill="#6c5ce7"># 角色设定</text>
    <text x="280" y="148" fill="#2d3436">你是一个<marker id="m1"/>专业的课程客服机器人</text>
    <text x="280" y="166" fill="#6c5ce7"># 能力边界</text>
    <text x="280" y="184" fill="#2d3436">✅ 回答课程相关问题</text>
    <text x="280" y="202" fill="#2d3436">✅ 提供学习路径建议</text>
    <text x="280" y="220" fill="#e17055">❌ 不涉及退费/教务</text>
    <text x="280" y="238" fill="#e17055">❌ 不确定时主动说明</text>
    <!-- Cursor -->
    <rect x="456" y="232" width="1.5" height="12" fill="#0984e3" opacity="0.8"/>
  </g>

  <!-- Section 2: Knowledge Base -->
  <rect x="260" y="290" width="260" height="150" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <rect x="260" y="290" width="260" height="36" rx="10" fill="#fff"/>
  <rect x="260" y="316" width="260" height="10" fill="#fff"/>
  <text x="280" y="314" fill="#2d3436" font-family="sans-serif" font-size="13" font-weight="bold">📚 知识库</text>
  <g transform="translate(280, 345)">
    <rect x="0" y="0" width="220" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
    <text x="10" y="15" fill="#636e72" font-family="sans-serif" font-size="10">📄 课程大纲_v3.pdf</text>
    <rect x="0" y="28" width="220" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
    <text x="10" y="43" fill="#636e72" font-family="sans-serif" font-size="10">📊 常见问题FAQ.xlsx</text>
    <rect x="0" y="56" width="220" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="10" y="71" fill="#b2bec3" font-family="sans-serif" font-size="10">+ 上传更多资料</text>
  </g>

  <!-- Section 3: Plugins -->
  <rect x="540" y="290" width="260" height="150" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <rect x="540" y="290" width="260" height="36" rx="10" fill="#fff"/>
  <rect x="540" y="316" width="260" height="10" fill="#fff"/>
  <text x="560" y="314" fill="#2d3436" font-family="sans-serif" font-size="13" font-weight="bold">🔌 插件</text>
  <g transform="translate(560, 340)">
    <rect x="0" y="0" width="100" height="60" rx="8" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
    <text x="50" y="28" text-anchor="middle" fill="#6c5ce7" font-family="sans-serif" font-size="18">🔍</text>
    <text x="50" y="48" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="10">网页搜索</text>
    <rect x="115" y="0" width="100" height="60" rx="8" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
    <text x="165" y="28" text-anchor="middle" fill="#0984e3" font-family="sans-serif" font-size="18">💻</text>
    <text x="165" y="48" text-anchor="middle" fill="#2d3436" font-family="sans-serif" font-size="10">代码执行</text>
  </g>

  <!-- Section 4: Workflow -->
  <rect x="260" y="455" width="540" height="130" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <rect x="260" y="455" width="540" height="36" rx="10" fill="#fff"/>
  <rect x="260" y="481" width="540" height="10" fill="#fff"/>
  <text x="280" y="479" fill="#2d3436" font-family="sans-serif" font-size="13" font-weight="bold">🔄 工作流编排</text>
  <g transform="translate(300, 495)">
    <!-- Mini workflow nodes -->
    <rect x="0" y="15" width="80" height="30" rx="15" fill="#6c5ce7" opacity="0.8"/>
    <text x="40" y="35" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">用户提问</text>
    <line x1="80" y1="30" x2="110" y2="30" stroke="#b2bec3" stroke-width="1.5"/>
    <polygon points="108,26 116,30 108,34" fill="#b2bec3"/>
    <rect x="116" y="15" width="80" height="30" rx="15" fill="#0984e3" opacity="0.8"/>
    <text x="156" y="35" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">知识库检索</text>
    <line x1="196" y1="30" x2="226" y2="30" stroke="#b2bec3" stroke-width="1.5"/>
    <polygon points="224,26 232,30 224,34" fill="#b2bec3"/>
    <rect x="232" y="15" width="80" height="30" rx="15" fill="#00b894" opacity="0.8"/>
    <text x="272" y="35" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">生成回答</text>
    <line x1="312" y1="30" x2="342" y2="30" stroke="#b2bec3" stroke-width="1.5"/>
    <polygon points="340,26 348,30 340,34" fill="#b2bec3"/>
    <rect x="348" y="15" width="80" height="30" rx="15" fill="#e17055" opacity="0.8"/>
    <text x="388" y="35" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="10">发布回复</text>

    <!-- Workflow label -->
    <text x="220" y="75" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">拖拽式可视化编排，无需编码</text>
  </g>

  <!-- Right panel: Preview / Test -->
  <rect x="820" y="75" width="320" height="510" rx="10" fill="#fff" stroke="#e9ecef" stroke-width="1"/>
  <rect x="820" y="75" width="320" height="36" rx="10" fill="#0984e3" opacity="0.07"/>
  <rect x="820" y="101" width="320" height="10" fill="#0984e3" opacity="0.07"/>
  <text x="980" y="99" text-anchor="middle" fill="#0984e3" font-family="sans-serif" font-size="13" font-weight="bold">💬 预览测试</text>

  <!-- Chat mockup -->
  <g transform="translate(835, 125)">
    <!-- Bot message -->
    <rect x="0" y="0" width="240" height="35" rx="10" fill="#f0f3ff"/>
    <text x="12" y="22" fill="#2d3436" font-family="sans-serif" font-size="11">你好！我是小课助手 🤖</text>
    <!-- User message -->
    <rect x="50" y="50" width="190" height="35" rx="10" fill="#e8f5e9"/>
    <text x="62" y="72" fill="#2d3436" font-family="sans-serif" font-size="11">这门课有哪些章节？</text>
    <!-- Bot reply -->
    <rect x="0" y="100" width="260" height="60" rx="10" fill="#f0f3ff"/>
    <text x="12" y="122" fill="#2d3436" font-family="sans-serif" font-size="11">本课程共8章，涵盖：</text>
    <text x="12" y="140" fill="#2d3436" font-family="sans-serif" font-size="11">1.基础语法 2.面向对象...</text>
    <!-- Input bar -->
    <rect x="0" y="180" width="260" height="32" rx="16" fill="#f8f9fa" stroke="#dfe6e9" stroke-width="1"/>
    <text x="15" y="201" fill="#b2bec3" font-family="sans-serif" font-size="10">输入测试问题...</text>
    <circle cx="245" cy="196" r="11" fill="#0984e3"/>
    <text x="241" y="201" fill="#fff" font-family="sans-serif" font-size="12">↑</text>
  </g>

  <!-- Publish button -->
  <g transform="translate(910, 460)" filter="url(#btnGlow)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#0984e3"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">🚀 发布</text>
  </g>
  <text x="980" y="520" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="10">一键发布到 Web / 飞书 / 微信</text>

  <!-- Cursor arrow -->
  <g transform="translate(730, 465)">
    <path d="M0,0 Q-15,-20 -30,-30 Q-40,-35 -35,-25 L-10,5" fill="#fdcb6e" stroke="#e17055" stroke-width="1"/>
    <text x="15" y="-5" fill="#e17055" font-family="sans-serif" font-size="9" font-style="italic">点击创建 Bot</text>
  </g>
</svg>
