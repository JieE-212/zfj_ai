<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#111122"/>
    </linearGradient>
    <filter id="glowRed">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#e17055" flood-opacity="0.3"/>
    </filter>
    <filter id="glowGreen">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00b894" flood-opacity="0.3"/>
    </filter>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#dfe6e9" font-family="sans-serif" font-size="24" font-weight="bold">Prompt 设计：好 vs 坏</text>
  <text x="600" y="68" text-anchor="middle" fill="#636e72" font-family="sans-serif" font-size="13">清晰的人设 + 明确的能力边界 = 可控的 AI Agent</text>

  <!-- Lightning bolt divider -->
  <g transform="translate(600, 340)" filter="url(#glowGreen)">
    <polygon points="0,-40 15,-8 5,-8 20,40 -5,8 5,8" fill="#fdcb6e" opacity="0.9"/>
    <circle cx="0" cy="-48" r="14" fill="none" stroke="#fdcb6e" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- BAD side (left) -->
  <g transform="translate(80, 105)">
    <!-- Bad card -->
    <rect x="0" y="0" width="490" height="480" rx="16" fill="#1a1a2e" stroke="#e17055" stroke-width="1" opacity="0.8" filter="url(#cardGlow)"/>
    <rect x="0" y="0" width="490" height="480" rx="16" fill="#e17055" opacity="0.04"/>

    <!-- Bad header -->
    <rect x="0" y="0" width="490" height="55" rx="16" fill="#e17055" opacity="0.12"/>
    <rect x="0" y="27" width="490" height="28" fill="#e17055" opacity="0.12"/>
    <text x="30" y="37" fill="#e17055" font-family="sans-serif" font-size="22">❌</text>
    <text x="65" y="37" fill="#ff7675" font-family="sans-serif" font-size="18" font-weight="bold">模糊的 Prompt</text>

    <!-- Bad content -->
    <g transform="translate(25, 80)" font-family="monospace">
      <rect x="0" y="0" width="440" height="370" rx="8" fill="#1e1e2e" stroke="#e17055" stroke-width="0.5" opacity="0.5"/>
      <text x="20" y="30" fill="#ff7675" font-size="12">你是一个客服。</text>
      <text x="20" y="60" fill="#636e72" font-size="11">回答用户的问题。</text>

      <!-- Problem annotations -->
      <g transform="translate(0, 100)">
        <line x1="0" y1="15" x2="420" y2="15" stroke="#e17055" stroke-width="0.5" opacity="0.3"/>
        <text x="15" y="35" fill="#ff7675" font-size="10">⚠ 没有人设定义 — 角色模糊</text>
      </g>

      <g transform="translate(0, 170)">
        <line x1="0" y1="15" x2="420" y2="15" stroke="#e17055" stroke-width="0.5" opacity="0.3"/>
        <text x="15" y="35" fill="#ff7675" font-size="10">⚠ 没有能力边界 — 什么都会回答</text>
      </g>

      <g transform="translate(0, 240)">
        <line x1="0" y1="15" x2="420" y2="15" stroke="#e17055" stroke-width="0.5" opacity="0.3"/>
        <text x="15" y="35" fill="#ff7675" font-size="10">⚠ 没有行为约束 — 可能编造信息</text>
      </g>

      <g transform="translate(0, 310)">
        <line x1="0" y1="15" x2="420" y2="15" stroke="#e17055" stroke-width="0.5" opacity="0.3"/>
        <text x="15" y="35" fill="#ff7675" font-size="10">⚠ 没有拒绝机制 — 边界外也强行回答</text>
      </g>
    </g>
  </g>

  <!-- GOOD side (right) -->
  <g transform="translate(630, 105)">
    <!-- Good card -->
    <rect x="0" y="0" width="490" height="480" rx="16" fill="#1a1a2e" stroke="#00b894" stroke-width="1" opacity="0.8" filter="url(#cardGlow)"/>
    <rect x="0" y="0" width="490" height="480" rx="16" fill="#00b894" opacity="0.04"/>

    <!-- Good header -->
    <rect x="0" y="0" width="490" height="55" rx="16" fill="#00b894" opacity="0.12"/>
    <rect x="0" y="27" width="490" height="28" fill="#00b894" opacity="0.12"/>
    <text x="30" y="37" fill="#00b894" font-family="sans-serif" font-size="22">✅</text>
    <text x="65" y="37" fill="#55efc4" font-family="sans-serif" font-size="18" font-weight="bold">清晰的 Prompt</text>

    <!-- Good content -->
    <g transform="translate(25, 80)" font-family="monospace">
      <rect x="0" y="0" width="440" height="370" rx="8" fill="#1e1e2e" stroke="#00b894" stroke-width="0.5" opacity="0.5"/>
      <text x="20" y="28" fill="#6c5ce7" font-size="12"># 角色</text>
      <text x="20" y="48" fill="#55efc4" font-size="11">你是课程客服"小课助手"</text>
      <text x="20" y="66" fill="#55efc4" font-size="11">专业、耐心、友好</text>

      <text x="20" y="96" fill="#6c5ce7" font-size="12"># 你能做 ✅</text>
      <text x="20" y="116" fill="#55efc4" font-size="11">• 回答课程内容问题</text>
      <text x="20" y="134" fill="#55efc4" font-size="11">• 提供学习路径建议</text>
      <text x="20" y="152" fill="#55efc4" font-size="11">• 解答技术疑问</text>

      <text x="20" y="182" fill="#6c5ce7" font-size="12"># 你不能做 ❌</text>
      <text x="20" y="202" fill="#ff7675" font-size="11">• 不涉及退费/教务</text>
      <text x="20" y="220" fill="#ff7675" font-size="11">• 不代替老师批改打分</text>
      <text x="20" y="238" fill="#ff7675" font-size="11">• 不确定的事情要说"不确定"</text>

      <text x="20" y="272" fill="#6c5ce7" font-size="12"># 行为准则</text>
      <text x="20" y="292" fill="#55efc4" font-size="11">• 始终基于知识库内容回答</text>
      <text x="20" y="310" fill="#55efc4" font-size="11">• 遇知识库外问题引导转人工</text>
    </g>
  </g>

  <!-- Key insight bar at bottom -->
  <rect x="100" y="600" width="1000" height="50" rx="25" fill="#1a1a2e" stroke="#fdcb6e" stroke-width="1" opacity="0.8"/>
  <text x="600" y="630" text-anchor="middle" fill="#fdcb6e" font-family="sans-serif" font-size="14">
    💡 核心原则：给 Agent 一个清晰的人设 + 告诉它能做什么、不能做什么 + 设定行为边界
  </text>
</svg>
